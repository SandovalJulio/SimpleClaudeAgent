<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; frame-src 'self' file:; media-src 'self' file:;" />
  <title>Agente</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dialogs.css" />
  <link rel="stylesheet" href="files.css" />
  <link rel="stylesheet" href="schedules.css" />
</head>
<body>
  <!-- ================= Barra lateral ================= -->
  <aside>
    <div class="brand">
      <img class="logo" src="logo.png" alt="" />
      <div><div class="name">Agente</div><div class="sub">Claude Agent SDK</div></div>
    </div>

    <button id="new-chat" class="btn flat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Nueva conversación
    </button>

    <div class="section" style="flex:1">
      <div class="section-head"><span>Conversaciones <span class="cnt" id="convs-cnt"></span></span></div>
      <input id="history-search" class="search" placeholder="Buscar conversaciones…" />
      <div id="convs" class="list" style="flex:1"></div>
    </div>

    <div class="side-foot">
      <button id="open-config" class="btn ghost" title="Configuración" style="margin-left:-8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Configuración
      </button>
    </div>
  </aside>

  <!-- ================= Principal ================= -->
  <main>
    <div class="center">
      <div class="topbar">
        <div class="crumb"><b id="crumb-title">Nueva conversación</b>
          <button id="ws-pill" class="pill" title="Carpeta de trabajo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span id="ws-label">Sin carpeta</span>
          </button>
        </div>
        <div class="status">
          <button id="conv-menu" class="btn ghost" title="Opciones de la conversación">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <span id="status-text">Listo</span><span id="status-dot" class="dot"></span>
        </div>
      </div>

      <div id="thread-area"></div>

      <!-- Compositor -->
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Describe la tarea… ( / para skills )"></textarea>
          <div class="bar">
            <button id="attach" class="ib" title="Adjuntar archivos (o arrástralos aquí)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="slash" class="ib" title="Skills y comandos"><span class="slash">/</span></button>
            <button id="model-pill" class="pill" title="Modelo y nivel de razonamiento">
              <span class="dotp"></span><span id="model-label">…</span><span class="sub" id="effort-label"></span>
            </button>
            <div id="attached" class="files"></div>
            <div class="right">
              <button id="mic" class="ib" title="Dictar (o usa Win+H)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              </button>
              <button id="perm-pill" class="pill" title="Permisos del agente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span id="perm-label">Auto</span>
              </button>
              <button id="send" class="send" title="Enviar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel lateral de vista previa (files.js) -->
    <div id="panel-root"></div>
  </main>

  <!-- Plantilla de pantalla de inicio (se clona en cada conversación nueva) -->
  <template id="hero-tpl">
    <div class="hero">
      <h1>¿En qué trabajamos hoy?</h1>
      <p>Describe la tarea. El agente puede leer y modificar archivos, ejecutar comandos, crear <b>skills</b> reutilizables y recordar tus correcciones.</p>
      <div class="chips">
        <button class="chip" data-act="explore">
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="ct"><b>Explorar la carpeta</b><span>Resumen de su contenido y organización.</span></span>
        </button>
        <button class="chip suggest" data-act="suggest" hidden>
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>
          <span class="ct"><b>Obtener sugerencia</b><span>Consejos basados en lo que el agente sabe de ti.</span></span>
        </button>
        <button class="chip" data-act="create">
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>
          <span class="ct"><b>Crear una skill</b><span>Rellena una plantilla con el nombre y el workflow.</span></span>
        </button>
        <button class="chip" data-act="attach">
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></span>
          <span class="ct"><b>Trabajar con archivos</b><span>Adjunta archivos y pregunta sobre ellos.</span></span>
        </button>
        <button class="chip" data-act="improve">
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
          <span class="ct"><b>Mejorar una skill</b><span>Elige una skill existente y describe el cambio.</span></span>
        </button>
        <button class="chip" data-act="artifact">
          <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 20h8"/></svg></span>
          <span class="ct"><b>Crear un artifact</b><span>Página, dashboard o informe visual con vista previa.</span></span>
        </button>
      </div>
    </div>
  </template>

  <div id="menu" class="menu"></div>
  <div id="toasts"></div>
  <div id="settings-root"></div>
  <div id="welcome-root"></div>

  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="app.js"></script>
  <script src="welcome.js"></script>
  <script src="dialogs.js"></script>
  <script src="files.js"></script>
  <script src="schedules.js"></script>
  <script src="chat.js"></script>
  <script src="convlist.js"></script>
  <script src="composer.js"></script>
  <script src="settings.js"></script>
</body>
</html>
