<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de Agente: dos eslabones entrelazados (persona + agente), uno vertical azul y otro horizontal
       violeta-rosa. El azul pasa por debajo en el cruce superior y por encima en el inferior. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7cf6"/>
      <stop offset="1" stop-color="#19c6da"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3dff"/>
      <stop offset="1" stop-color="#ff5c9a"/>
    </linearGradient>
    <clipPath id="c"><circle cx="272" cy="331" r="72"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".16"/>
    </filter>
  </defs>
  <g fill="none" stroke-width="52" transform="translate(-6 37) rotate(-12 256 256)" filter="url(#s)">
    <rect x="125" y="56" width="150" height="325" rx="75" stroke="url(#a)"/>
    <rect x="150" y="181" width="250" height="150" rx="75" stroke="url(#b)"/>
    <rect x="125" y="56" width="150" height="325" rx="75" stroke="url(#a)" clip-path="url(#c)"/>
  </g>
</svg>
